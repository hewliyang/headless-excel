[project]
name = "headless-excel"
version = "0.1.0"
description = "Excel wrapper with automatic recalculation via LibreOffice - OfficeJS-style API for headless environments"
readme = "README.md"
authors = [{ name = "Hew Li Yang", email = "hewliyang@u.nus.edu" }]
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "excel",
    "openpyxl",
    "libreoffice",
    "spreadsheet",
    "automation",
    "headless",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "openpyxl>=3.1.0",
    "yfinance>=0.2.66",
]

[project.urls]
Homepage = "https://github.com/brightriver/headless-excel"
Repository = "https://github.com/brightriver/headless-excel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest>=8.0.0", "pytest-cov>=4.0.0", "ruff>=0.1.0"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]              # line length in XML macro strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
